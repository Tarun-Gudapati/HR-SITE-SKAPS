name: Deploy to Cloudflare Pages
# Builds the site for the domain root (base "/") and uploads it to the
# Cloudflare Pages project "skaps-hr", which serves https://skaps.co.in.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:root
        env:
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
          VITE_LEAD_ACCESS_KEY: ${{ vars.VITE_LEAD_ACCESS_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-root --project-name=skaps-hr --branch=main --commit-hash=${{ github.sha }}
